name: Crypto Day Trading Briefing v2

# 2x sehari (Opsi A — Day Trading, MTF SMC + S&D):
#   - Sesi Siang: 13:30 WIB  = 06:30 UTC  -> cron "30 6 * * *"
#   - Sesi Malam: 19:00 WIB  = 12:00 UTC  -> cron "0 12 * * *"
# Evaluasi sinyal sesi sebelumnya (history.json) dieksekusi di awal tiap run
# sebelum briefing baru, via build_recap() di bot.py.
on:
  schedule:
    - cron: "30 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Mencegah tumpang-tindih (cron + manual) agar history.json tidak race
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  run-daily-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout kode
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan Day Trading Briefing v2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opsional:
          # CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          # ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python bot.py

      # Runner GitHub Actions di-reset tiap run → riwayat sinyal di-commit balik
      # agar data evaluasi esok hari tidak hilang.
      - name: Commit balik riwayat sinyal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "history.json tidak berubah — riwayat sudah terbaru."
          else
            git commit -m "chore: update signal history"
            git push origin HEAD
          fi
